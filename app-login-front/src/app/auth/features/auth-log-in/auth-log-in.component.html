<div class="w-full max-w-md p-8 space-y-6 bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl">
  <div class="text-center">
    <h2 class="text-3xl font-extrabold text-white">Inicia sesión</h2>
    <p class="mt-2 text-sm text-slate-400">Ingresa los datos para iniciar tu cuenta</p>
  </div>

  <form class="max-w-md mx-auto" action="#">
    <div>
      <label for="email" class="block mb-2 text-sm font-medium text-slate-300 dark:text-white">Usuario</label>
      <input type="email" name="email" id="email"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        placeholder="name@company.com" required />
    </div>
    <div>
      <label for="password" class="block mb-2 text-sm font-medium text-slate-300   dark:text-white">Constraseña</label>
      <input type="password" name="password" id="password" placeholder="••••••••"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        required />
    </div>
    <div class="my-[20px]">
      <button type="submit"
        class="w-full px-5 py-3 text-base font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
        Login to your account
      </button>
    </div>

    <div>
      <p class="block mb-2 text-sm font-medium text-slate-300   dark:text-white">Si por alguna razón <a href="#"
          class="ms-auto text-sm font-medium text-blue-600 hover:underline dark:text-blue-500">
          Perdiste tu contraseña?
        </a>
      </p>
    </div>

    <div class="text-sm font-medium text-gray-900 dark:text-white">
      <p class="block mb-2 text-sm font-medium text-slate-300   dark:text-white">
        Si lo deseas puedes
        <a class="text-blue-600 hover:underline dark:text-blue-500">Crear una nueva cuenta</a>
      </p>
    </div>

  </form>
</div>
